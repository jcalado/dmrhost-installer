<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DMRHost installer</title>
<style>
:root {
  --panel: #1d2023; --panel-2: #24282c; --panel-3: #2c3136; --rule: #3a4046; --rule-2: #4a5158;
  --legend: #b3bac2; --legend-dim: #8d959e; --white: #eef1f3;
  --lcd: #e4e0cc; --lcd-ink: #17190f; --lcd-dim: #5c5946;
  --rx: #35b46a; --rx-text: #8fe0b0; --busy: #f0a020;
  --warn-bg: #2a2418; --warn-rule: #5a4520; --warn-text: #f3d9a4; --warn-link: #ffd88a; --fail-text: #ff8a8d; --alarm-bg: #3a1e20;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  /* spacing: tight inside a field, wider between fields, widest around actions */
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--panel); color: var(--white); font: 14px/1.45 var(--sans); }
.wrap { max-width: 760px; margin: 0 auto; padding: var(--s6) var(--s4) 64px; }
header { display: flex; align-items: baseline; gap: var(--s3); margin-bottom: var(--s5); }
header h1 { font-size: 17px; font-weight: 600; margin: 0; }
header .ver { color: var(--legend-dim); font: 12px var(--mono); }

/* Step bar: each segment fills like an LED meter. On "Card ready" they all light in turn. */
ol.steps { list-style: none; display: flex; gap: var(--s1); padding: 0; margin: 0 0 var(--s5); flex-wrap: wrap; }
ol.steps li { position: relative; flex: 1 1 0; min-width: 84px; padding: 8px 10px 6px; border-top: 3px solid var(--rule);
  color: var(--legend-dim); font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
  transition: color .2s var(--ease-out); }
ol.steps li::before { content: ""; position: absolute; left: 0; right: 0; top: -3px; height: 3px; background: var(--rx);
  transform: scaleX(0); transform-origin: left;
  transition: transform .35s var(--ease-out), background-color .25s var(--ease-out); }
ol.steps li.done { color: var(--legend); cursor: pointer; }
ol.steps li.done::before { transform: scaleX(1); background: var(--rule-2); }
ol.steps li.on { color: var(--white); }
ol.steps li.on::before { transform: scaleX(1); }
ol.steps.lit li { color: var(--white); }
ol.steps.lit li::before { transform: scaleX(1); background: var(--rx); transition-delay: calc(var(--i) * 70ms); }
@media (max-width: 560px) {
  /* one row: segments only, with room for the current step's name */
  ol.steps { flex-wrap: nowrap; }
  ol.steps li { min-width: 0; padding: var(--s2) 0 0; white-space: nowrap; overflow: hidden; transition: flex-grow .3s var(--ease-out); }
  ol.steps li:not(.on) { font-size: 0; }
  ol.steps li.on { flex-grow: 3; }
}

/* Step content arrives from the direction of travel */
.view.fwd { animation: in-fwd .26s var(--ease-out); }
.view.back { animation: in-back .26s var(--ease-out); }
@keyframes in-fwd { from { opacity: 0; transform: translateX(14px); } }
@keyframes in-back { from { opacity: 0; transform: translateX(-14px); } }

.card { background: var(--panel-2); border: 1px solid var(--rule); border-radius: 6px; padding: var(--s6); }
@media (max-width: 560px) { .card { padding: var(--s5) var(--s4); } }
.card h2 { font-size: 17px; font-weight: 600; margin: 0 0 var(--s5); }
.card h2:has(+ p.lede) { margin-bottom: var(--s2); }
.card p.lede { color: var(--legend); margin: 0 0 var(--s5); max-width: 62ch; }

.field { margin: 0 0 var(--s5); }
.field label.l { display: block; font-weight: 600; margin-bottom: var(--s2); }
.field .help { color: var(--legend-dim); font-size: 13px; margin-top: var(--s2); max-width: 62ch; }
.field .err { color: var(--fail-text); font-size: 13px; margin-top: var(--s2); }
.field .err + .help { margin-top: var(--s1); }
.field .warn { display: flex; gap: var(--s3); align-items: flex-start; margin-top: var(--s3);
  padding: var(--s3) var(--s4); border: 1px solid var(--warn-rule); border-radius: 4px;
  background: var(--warn-bg); color: var(--warn-text); font-size: 13px; line-height: 1.5; }
.field .warn svg { flex: none; margin-top: 1px; color: var(--busy); }
.field .warn b { color: var(--white); font-weight: 600; }
.field .warn a { color: var(--warn-link); overflow-wrap: anywhere; }
.field .warn + .help { margin-top: var(--s2); }
.field .find { margin-top: var(--s3); padding: var(--s3) var(--s4); border: 1px solid var(--rule); border-radius: 4px;
  background: var(--panel); font-size: 13px; line-height: 1.5; }
.field .find a { font-weight: 600; }
.field .find > div + div { margin-top: var(--s1); }
.field .err.new { animation: err-in .2s var(--ease-out); }
@keyframes err-in { from { opacity: 0; transform: translateY(-3px); } }
input, textarea, select { transition: border-color .15s var(--ease-out); }
.field.bad input, .field.bad textarea, .field.bad select { border-color: var(--fail-text); }
input[type=text], input[type=password], textarea, select {
  width: 100%; background: var(--panel); color: var(--white); border: 1px solid var(--rule-2);
  border-radius: 4px; padding: 10px var(--s3); font: 14px var(--sans); }
input.mono, textarea { font-family: var(--mono); font-size: 13px; }
textarea { min-height: 70px; resize: vertical; }
input:focus, textarea:focus, select:focus, button:focus-visible, .opt:focus-within {
  outline: 2px solid var(--rx); outline-offset: 1px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 var(--s5); }
@media (max-width: 560px) { .row2 { grid-template-columns: 1fr; } }

.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: var(--s2); }
.opt { display: block; border: 1px solid var(--rule-2); border-radius: 4px; padding: var(--s3) 14px; cursor: pointer;
  background: var(--panel); }
.opt input { position: absolute; opacity: 0; }
.opt b { display: block; font-weight: 600; margin-bottom: 2px; }
.opt span { color: var(--legend-dim); font-size: 13px; }
.opt { transition: border-color .15s var(--ease-out), background-color .15s var(--ease-out); }
.opt:hover:not(.sel) { border-color: var(--legend-dim); }
.opt.sel { border-color: var(--rx); background: var(--panel-3); }
.opt.picked { animation: picked .22s var(--ease-out); }
@keyframes picked { from { border-color: var(--rule-2); background: var(--panel); } }
/* radioid.net suggestions under DMR ID / ESSID */
.ids:empty { display: none; }
.ids { margin: calc(-1 * var(--s2)) 0 var(--s5); }
.ids p { margin: 0; font-size: 13px; }
.ids-head { color: var(--legend); margin-bottom: var(--s2) !important; }
.id-list { display: flex; flex-wrap: wrap; gap: var(--s2); }
.id-chip { display: grid; grid-template-columns: auto 1fr; column-gap: var(--s3); align-items: baseline; text-align: left;
  padding: var(--s2) var(--s3); background: var(--panel); font-weight: 400; }
.ids.new { animation: fade .15s ease-out; }
input.upper { text-transform: uppercase; }
input.upper::placeholder { text-transform: none; }
.id-chip b { font: 600 14px var(--mono); }
.id-chip span { color: var(--legend); font-size: 13px; }
.id-chip small { grid-column: 2; color: var(--legend-dim); font-size: 12px; }
.id-chip.sel { border-color: var(--rx); background: var(--panel-3); }
.id-chip.sel b { color: var(--rx-text); }

/* Master search: the list drops over the fields below and scrolls */
.combo { position: relative; }
.combo-list { position: absolute; z-index: 5; left: 0; right: 0; top: calc(100% + var(--s1)); max-height: 300px;
  overflow-y: auto; background: var(--panel); border: 1px solid var(--rule-2); border-radius: 4px;
  padding: var(--s1) 0; box-shadow: 0 8px 24px rgba(0, 0, 0, .45); animation: fade .12s ease-out; }
.combo-group { display: flex; justify-content: space-between; padding: var(--s3) var(--s3) var(--s1);
  color: var(--legend); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
.combo-group span { color: var(--legend-dim); font: 12px var(--mono); }
.combo-opt { display: flex; gap: var(--s3); align-items: baseline; padding: 7px var(--s3) 7px var(--s5); cursor: pointer;
  font: 13px var(--mono); }
.combo-opt b { font-weight: 600; min-width: 4ch; }
.combo-opt span { color: var(--legend-dim); }
.combo-opt.on, .combo-opt:hover { background: var(--panel-3); }
.combo-opt[aria-selected=true] b { color: var(--rx-text); }
.combo-opt.typed { padding-left: var(--s3); font-family: var(--sans); border-top: 1px solid var(--rule); margin-top: var(--s1); }
.combo-opt.typed b { font-family: var(--mono); }
.combo-empty { padding: var(--s3); color: var(--legend-dim); }
.switch { display: flex; gap: 10px; align-items: center; cursor: pointer; font-weight: 600; }
.switch input { width: 18px; height: 18px; accent-color: var(--rx); }

.lcd { background: var(--lcd); color: var(--lcd-ink); border-radius: 4px; padding: var(--s3) var(--s4); margin: calc(-1 * var(--s2)) 0 var(--s5);
  font: 600 15px var(--mono); display: flex; gap: var(--s2) var(--s5); flex-wrap: wrap; }
.lcd small { color: var(--lcd-dim); font-weight: 600; font-size: 11px; display: block; letter-spacing: .08em; }

nav.btns { display: flex; justify-content: space-between; align-items: center; gap: var(--s3); margin-top: var(--s6);
  padding-top: var(--s5); border-top: 1px solid var(--rule); }
button { font: 600 14px var(--sans); padding: 10px 20px; border-radius: 4px; border: 1px solid var(--rule-2);
  background: var(--panel-3); color: var(--white); cursor: pointer; }
button.go { background: var(--rx); border-color: var(--rx); color: #08140d; }
button:disabled { opacity: .5; cursor: default; }
button { transition: background-color .15s var(--ease-out), border-color .15s var(--ease-out), filter .15s, transform .1s; }
button:hover:not(:disabled) { border-color: var(--legend-dim); }
button.go:hover:not(:disabled) { border-color: var(--rx); filter: brightness(1.08); }
button:active:not(:disabled) { transform: scale(.97); }
/* writing: a bar runs along the button's foot until the card answers */
button.busy, button.busy:disabled { position: relative; overflow: hidden; opacity: 1; }
button.busy::after { content: ""; position: absolute; left: 0; bottom: 0; width: 40%; height: 3px;
  background: rgba(8, 20, 13, .5); animation: sweep 1.1s var(--ease-out) infinite; }
@keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(260%); } }

.vol { transition: border-color .15s var(--ease-out), background-color .15s var(--ease-out); }
.vol:not(.no):hover:not(.sel) { border-color: var(--legend-dim); }

/* "Card ready": the check draws once the step bar has lit */
.ready { display: flex; align-items: center; gap: 10px; }
.ready svg { flex: none; }
.ready path { stroke-dasharray: 24; stroke-dashoffset: 24; animation: draw .4s var(--ease-out) .45s forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }

@media (prefers-reduced-motion: reduce) {
  /* no travel: segments and views cross-fade, feedback stays */
  ol.steps li::before { transform: none; opacity: 0; transition: opacity .2s, background-color .2s; }
  ol.steps li.on::before, ol.steps li.done::before, ol.steps.lit li::before { transform: none; opacity: 1; }
  .view.fwd, .view.back { animation: fade .15s ease-out; }
  .field .err.new { animation: fade .15s ease-out; }
  button:active:not(:disabled) { transform: none; }
  button.busy::after { width: 100%; animation: pulse 1.2s ease-in-out infinite alternate; }
  .ready path { animation: none; stroke-dashoffset: 0; }
  .radar { animation: pulse 1.2s ease-in-out infinite alternate; box-shadow: none; }
}
@keyframes fade { from { opacity: 0; } }
@keyframes pulse { from { opacity: .2; } to { opacity: .7; } }

ol.how { padding-left: 20px; margin: 0 0 var(--s5); color: var(--legend); max-width: 66ch; }
ol.how li { margin-bottom: var(--s3); padding-left: var(--s1); }
ol.how li:last-child { margin-bottom: 0; }
ol.how b { color: var(--white); }
/* Write step: grouped review, then the card */
.lcd.review { margin: 0 0 var(--s5); }
.review-groups { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s3); margin: 0 0 var(--s6); }
@media (max-width: 640px) { .review-groups { grid-template-columns: 1fr; } }
.rgroup { border: 1px solid var(--rule); border-radius: 4px; padding: var(--s3) var(--s4) var(--s4); background: var(--panel); }
.rgroup header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: var(--s2); }
.rgroup h3.sub { margin: 0; }
.rgroup dl { margin: 0; }
.rgroup dt { color: var(--legend-dim); font-size: 12px; margin-top: var(--s3); }
.rgroup dt:first-child { margin-top: 0; }
.rgroup dd { margin: 2px 0 0; font: 13px var(--mono); overflow-wrap: break-word; }
button.to-review { margin-left: auto; }
button.link { background: none; border: 0; padding: 2px 0; color: var(--rx-text); font: 600 13px var(--sans);
  text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
button.link:hover:not(:disabled) { filter: brightness(1.15); }
h3.card-head { margin-bottom: var(--s3); }
.waiting { display: flex; gap: var(--s4); align-items: center; padding: var(--s4); border: 1px dashed var(--rule-2);
  border-radius: 4px; background: var(--panel); margin-bottom: var(--s3); }
.waiting b { display: block; font-weight: 600; margin-bottom: 2px; }
.radar { flex: none; width: 12px; height: 12px; margin: 0 4px; border-radius: 50%; background: var(--busy);
  box-shadow: 0 0 0 0 rgba(240, 160, 32, .5); animation: ping 1.6s var(--ease-out) infinite; }
@keyframes ping { to { box-shadow: 0 0 0 10px rgba(240, 160, 32, 0); } }
.vol-hint { margin: var(--s2) 0 0; font-size: 13px; }
p.fine { margin: var(--s5) 0 0; font-size: 13px; max-width: 62ch; }
.vol { display: flex; gap: var(--s3); align-items: flex-start; cursor: pointer; border: 1px solid var(--rule-2); border-radius: 4px;
  padding: var(--s3) 14px; margin-bottom: var(--s2); cursor: pointer; background: var(--panel); }
.vol.sel { border-color: var(--rx); background: var(--panel-3); }
.vol.no { cursor: default; opacity: .7; }
.vol code { font-family: var(--mono); }
.vol input { accent-color: var(--rx); margin: 3px 0 0; }
.vol .st { color: var(--legend-dim); font-size: 13px; }
.vol.no .st { color: var(--busy); }
.note { background: var(--panel); border: 1px solid var(--rule); border-radius: 4px; padding: var(--s3) var(--s4); color: var(--legend); margin: 0 0 var(--s4); }
.note::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--busy); margin-right: var(--s2); vertical-align: 1px; }
.alarm { background: var(--alarm-bg); color: var(--fail-text); padding: var(--s3) var(--s4); border-radius: 4px; margin: var(--s4) 0 0; }
.ok { color: var(--rx-text); }
code.cmd { display: block; background: var(--panel); border: 1px solid var(--rule); padding: 8px 10px; border-radius: 4px;
  font: 13px var(--mono); overflow-x: auto; white-space: pre; margin: var(--s3) 0 var(--s5); }
.muted { color: var(--legend-dim); }
h3.sub { font-size: 14px; font-weight: 600; margin: 0 0 var(--s3); }
/* Start: resume where you left off */
.resume { display: flex; flex-wrap: wrap; gap: var(--s4); align-items: center; justify-content: space-between;
  padding: var(--s4); margin: 0 0 var(--s6); border: 1px solid var(--rx); border-radius: 4px; background: var(--panel-3); }
.resume > div:first-child { flex: 1 1 320px; }
.resume b { display: block; font-weight: 600; margin-bottom: var(--s1); }
.resume p { margin: 0; color: var(--legend); font-size: 13px; max-width: 62ch; }
.resume-btns { display: flex; gap: var(--s2); flex-wrap: wrap; }

/* Start: fill the answers in from a WPSD or Pi-Star backup */
.import { padding: var(--s4); margin: 0 0 var(--s6); border: 1px dashed var(--rule-2); border-radius: 4px; background: var(--panel); }
.import.over { border-color: var(--rx); background: var(--panel-3); }
.import.done { border-style: solid; border-color: var(--rx); }
.import-head { display: flex; flex-wrap: wrap; gap: var(--s4); align-items: center; justify-content: space-between; }
.import-head > div { flex: 1 1 320px; }
.import-head p { margin: 0; color: var(--legend); font-size: 13px; max-width: 62ch; }
.import h3.sub { margin-bottom: var(--s1); }
.import .alarm { margin-top: var(--s3); }
.import dl { display: grid; grid-template-columns: max-content 1fr; gap: var(--s1) var(--s4); margin: var(--s4) 0 0; font-size: 13px; }
.import dt { color: var(--legend-dim); }
.import dd { margin: 0; }
.import ul { margin: var(--s3) 0 0; padding-left: 20px; color: var(--legend); font-size: 13px; max-width: 66ch; }
.import nav.btns { margin-top: var(--s4); }

/* Start: the two downloads side by side */
.get { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s4); margin: 0 0 var(--s6); }
@media (max-width: 560px) { .get { grid-template-columns: 1fr; } }
.get > div { border: 1px solid var(--rule); border-radius: 4px; padding: var(--s4); background: var(--panel); }
.get h3.sub { margin-bottom: var(--s1); }
.get p { margin: 0 0 var(--s3); color: var(--legend); }
.get p.muted { margin: var(--s3) 0 0; font-size: 13px; color: var(--legend-dim); }
.get > div { display: flex; flex-direction: column; align-items: flex-start; }
a.dl { display: inline-flex; align-items: center; gap: var(--s2); padding: 10px var(--s4); border-radius: 4px;
  background: var(--rx); color: #08140d; font-weight: 600; text-decoration: none; transition: filter .15s; }
a.dl:hover { filter: brightness(1.08); }
a.dl svg { width: 18px; height: 18px; }
.get p.dl-note { margin: var(--s2) 0 0; font-size: 13px; color: var(--legend-dim); }
.get p.more { margin: auto 0 0; padding-top: var(--s3); font-size: 13px; }
.choices.flash { margin: 0 0 var(--s4); }
.get:has(> div:only-child) { grid-template-columns: 1fr; }
ol.how code { font: 12px var(--mono); }
ol.how code.cmd { font-size: 12px; margin: var(--s2) 0 var(--s2); white-space: pre; }
.warn.inline { display: flex; gap: var(--s2); align-items: flex-start; padding: var(--s2) var(--s3); border: 1px solid var(--warn-rule);
  border-radius: 4px; background: var(--warn-bg); color: var(--warn-text); font-size: 13px; }
.warn.inline svg { flex: none; color: var(--busy); width: 16px; height: 16px; margin-top: 1px; }
/* Dashboard step: what dmrdash does */
.card h2:has(+ .pitch) { margin-bottom: var(--s2); }
.pitch { margin: 0 0 var(--s6); padding-bottom: var(--s5); border-bottom: 1px solid var(--rule); }
.pitch figure { margin: 0 0 var(--s5); }
.pitch img { display: block; width: 100%; height: auto; border: 1px solid var(--rule-2); border-radius: 6px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, .35); }
.pitch figcaption { margin-top: var(--s2); color: var(--legend-dim); font-size: 12px; }
.feats { list-style: none; margin: 0 0 var(--s4); padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: var(--s4) var(--s5); }
@media (max-width: 640px) { .feats { grid-template-columns: 1fr; } }
.feats li { padding-left: var(--s4); border-left: 2px solid var(--rx); }
.feats b { display: block; font-weight: 600; margin-bottom: 2px; }
.feats li > span { color: var(--legend); font-size: 13px; line-height: 1.5; }
.feats .tag { margin-left: var(--s2); padding: 1px 6px; border: 1px solid var(--rule-2); border-radius: 3px;
  color: var(--legend-dim); font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; vertical-align: 1px; }
p.small { font-size: 13px; margin: 0; }

/* "Other systems": a native disclosure, opened as a small menu */
details.menu { position: relative; margin-top: auto; padding-top: var(--s3); }
details.menu summary { cursor: pointer; color: var(--rx-text); font-size: 13px; font-weight: 600; list-style: none;
  display: inline-flex; align-items: center; gap: 6px; }
details.menu summary::-webkit-details-marker { display: none; }
details.menu summary::after { content: ""; width: 6px; height: 6px; border: solid currentColor; border-width: 0 2px 2px 0;
  transform: translateY(-2px) rotate(45deg); transition: transform .15s var(--ease-out); }
details.menu[open] summary::after { transform: translateY(1px) rotate(225deg); }
.menu-list { position: absolute; z-index: 5; left: 0; top: calc(100% + var(--s1)); min-width: 260px; padding: var(--s1) 0;
  background: var(--panel-2); border: 1px solid var(--rule-2); border-radius: 4px; box-shadow: 0 8px 24px rgba(0, 0, 0, .45);
  animation: fade .12s ease-out; }
.menu-list a { display: flex; gap: var(--s3); align-items: flex-start; padding: var(--s2) var(--s3); color: var(--white);
  text-decoration: none; font-weight: 600; }
.menu-list a svg { flex: none; margin-top: 2px; }
.menu-list a small { display: block; font-weight: 400; font-size: 12px; color: var(--legend-dim); }
.menu-list a:hover, .menu-list a:focus-visible { background: var(--panel-3); outline: none; }
.menu-list a.all { border-top: 1px solid var(--rule); margin-top: var(--s1); padding-top: var(--s2); font-weight: 400;
  font-size: 13px; color: var(--rx-text); }
a { color: var(--rx-text); text-underline-offset: 2px; }
a:focus-visible { outline: 2px solid var(--rx); outline-offset: 2px; }
.field.typed { margin-top: var(--s3); }
</style>
</head>
<body>
<div class="wrap">
  <header><h1>DMRHost hotspot installer</h1><span class="ver" id="ver"></span></header>
  <ol class="steps" id="steps"></ol>
  <main class="card" id="main" aria-live="polite"><p class="muted">Loading…</p></main>
</div>
<script>
"use strict";
const TOKEN = location.hash.slice(1);
const $ = (s, el = document) => el.querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) el.append(k.nodeType ? k : String(k));
  return el;
}
async function api(path, body) {
  const r = await fetch(path, body === undefined ? { headers: { "X-Token": TOKEN } } :
    { method: "POST", headers: { "X-Token": TOKEN, "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (r.status === 403) throw new Error("This page's link is out of date. Use the address the installer printed in the terminal.");
  return r.json();
}

const S = { sections: [], answers: {}, errors: {}, step: 0, masters: null, volumes: [], boot: "", summary: [], dmrdash: "" };
// steps: intro, one per section, write, done
const stepNames = () => ["Start", ...S.sections.map(s => s.title), "Write"];

function visible(f) {
  if (!f.when) return true;
  const [k, want] = f.when, have = S.answers[k];
  return want === true ? !!have : have === want;
}

function renderSteps() {
  // the same <li>s stay in place, so their fill can transition between steps
  const ol = $("#steps"), names = stepNames(), finished = S.step > S.sections.length + 1;
  if (ol.children.length !== names.length)
    ol.replaceChildren(...names.map((n, i) => h("li", { style: `--i:${i}`, onclick: () => {
      if (ol.children[i].classList.contains("done")) go(i); } }, n)));
  [...ol.children].forEach((li, i) => {
    li.className = i === S.step ? "on" : i < S.step && !finished ? "done" : "";
  });
  ol.classList.toggle("lit", finished);
}

function fieldEl(f) {
  const id = "f-" + f.key, v = S.answers[f.key] ?? "", err = S.errors[f.key];
  const set = val => { S.answers[f.key] = val; delete S.errors[f.key]; saveSoon(); };
  let input;
  if (f.kind === "choice") {
    input = h("div", { class: "choices", role: "radiogroup", "aria-labelledby": id + "-l" },
      f.choices.map(([val, name, desc]) => h("label", {
          class: "opt" + (v === val ? " sel" : "") + (v === val && S.picked === f.key ? " picked" : "") },
        h("input", { type: "radio", name: f.key, value: val, checked: v === val,
          onchange: () => { set(val); S.picked = f.key; render(); } }),
        h("b", {}, name), desc ? h("span", {}, desc) : null)));
  } else if (f.kind === "bool") {
    return h("div", { class: "field" },
      h("label", { class: "switch" }, h("input", { type: "checkbox", id, checked: !!v,
        onchange: e => { set(e.target.checked); render(); } }), f.label),
      f.help ? h("div", { class: "help" }, f.help) : null);
  } else if (f.kind === "master") {
    input = masterEl(f, set);
  } else if (f.kind === "textarea") {
    input = h("textarea", { id, spellcheck: "false", oninput: e => set(e.target.value) }, v);
  } else {
    input = h("input", { id, type: f.kind === "password" ? "password" : "text", value: v,
      placeholder: f.placeholder || null, autocomplete: "off", spellcheck: "false",
      class: [["freq", "password"].includes(f.kind) || f.key === "rx_offset" ? "mono" : "", f.upper ? "upper" : ""].join(" ").trim() || null,
      inputmode: f.kind === "freq" ? "decimal" : null,
      oninput: e => {
        const was = !!S.answers[f.key];
        set(f.upper ? e.target.value.toUpperCase() : e.target.value);
        // fields shown "when" this one is filled in appear or go as it empties
        if (was !== !!S.answers[f.key] && S.sections.some(s => s.fields.some(g => g.when && g.when[0] === f.key))) render();
        else if (f.kind === "freq") refreshLive();
        if (f.key === "callsign") lookupIds(); } });
  }
  return h("div", { class: "field" + (err ? " bad" : ""), "data-key": f.key },
    h("label", { class: "l", for: f.kind === "choice" ? null : id, id: id + "-l" }, f.label),
    input,
    err ? h("div", { class: S.freshErrors ? "err new" : "err" }, err) : null,
    f.warn ? h("div", { class: "warn", role: "note" }, warnIcon(),
      h("div", {}, f.warn, f.link ? [" ", ext(f.link, f.link.replace(/^https:\/\//, ""))] : null)) : null,
    f.help ? h("div", { class: "help" }, f.help) : null,
    f.find ? findEl(f) : null);
}

// "Where to find it", with a deep link built from the callsign when there is one
function findEl(f) {
  const call = (S.answers.callsign || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
  const link = f.find_link && (call || !f.find_link.includes("{callsign}")) ? f.find_link.replace("{callsign}", call) : "";
  return h("div", { class: "find" },
    link ? h("div", {}, ext(link, f.find_link_text || link), h("span", { class: "muted" }, " (opens BrandMeister)")) : null,
    h("div", { class: "muted" }, f.find));
}

function masterEl(f, set) {
  const v = S.answers.master ?? "";
  if (S.masters === null) {
    api("/api/masters").then(m => { S.masters = m; preselectMaster(); render(); });
    return h("input", { type: "text", disabled: true, value: "Fetching the BrandMeister master list…" });
  }
  return masterPicker(v, set);
}

// BrandMeister only gives country codes; the browser knows their names.
const regionName = (() => {
  let dn = null;
  try { dn = new Intl.DisplayNames(["en"], { type: "region" }); } catch (_) { /* old browser: codes only */ }
  return cc => { try { return (dn && dn.of(cc)) || cc; } catch (_) { return cc; } };
})();
const fold = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const looksLikeAddress = q => /[.:]/.test(q) && !/\s/.test(q);

function masterLabel(v) {
  const m = (S.masters || []).find(m => String(m.id) === v);
  return m ? `${m.id} · ${regionName(m.country)}` : v;
}

// A searchable list of masters, grouped by country A–Z. A country name or code, a master ID
// or an address filters it; an address can also be used as typed.
function masterPicker(v, set) {
  const rows = S.masters.map(m => ({ ...m, name: regionName(m.country) }))
    .sort((a, b) => a.name.localeCompare(b.name) || a.id - b.id);
  const list = h("div", { class: "combo-list", id: "f-master-list", role: "listbox", hidden: true });
  const input = h("input", { id: "f-master", type: "text", role: "combobox", autocomplete: "off",
    spellcheck: "false", "aria-autocomplete": "list", "aria-expanded": "false", "aria-controls": "f-master-list",
    placeholder: rows.length ? "Search: Portugal, PT, 2682…" : "Master address, optionally host:port",
    value: masterLabel(v) });
  let shown = [], active = -1;
  const current = () => S.answers.master ?? "";

  function matches(q) {
    q = fold(q.trim());
    if (!q || q === fold(masterLabel(current()))) return rows.slice();  // a copy: paint() appends to it
    return rows.filter(m => fold(m.name).includes(q) || m.country.toLowerCase() === q ||
      String(m.id).startsWith(q) || m.address.startsWith(q));
  }
  function choose(val) {
    S.masterTouched = true;
    set(val); input.value = masterLabel(val); close();
    const f = input.closest(".field");
    f.classList.remove("bad");
    const e = $(".err", f); if (e) e.remove();
  }
  function paint() {
    const q = input.value.trim();
    shown = matches(q);
    if (looksLikeAddress(q)) shown.push({ typed: q });
    list.replaceChildren();
    let group = null;
    shown.forEach((m, i) => {
      const cls = "combo-opt" + (i === active ? " on" : "");
      const pick = e => { e.preventDefault(); choose(m.typed || String(m.id)); };
      if (m.typed) {
        list.append(h("div", { class: cls + " typed", role: "option", id: `f-master-o${i}`, onmousedown: pick },
          "Use ", h("b", {}, m.typed)));
        return;
      }
      if (m.country !== group) {
        list.append(h("div", { class: "combo-group", role: "presentation" }, m.name, h("span", {}, m.country)));
        group = m.country;
      }
      list.append(h("div", { class: cls, role: "option", id: `f-master-o${i}`, onmousedown: pick,
        "aria-selected": String(m.id) === current() ? "true" : "false" },
        h("b", {}, m.id), h("span", {}, m.address)));
    });
    if (!shown.length) list.append(h("div", { class: "combo-empty" }, "No master matches. Type an address to use it as is."));
    input.setAttribute("aria-activedescendant", active >= 0 && shown[active] ? `f-master-o${active}` : "");
    const on = $(".combo-opt.on", list);
    if (on) on.scrollIntoView({ block: "nearest" });
  }
  function open() { list.hidden = false; input.setAttribute("aria-expanded", "true"); paint(); }
  function close() { list.hidden = true; input.setAttribute("aria-expanded", "false"); active = -1; }

  let justFocused = false;
  input.addEventListener("focus", () => { input.select(); justFocused = true; open(); });
  // the click that focused the box would otherwise undo the select-all on mouseup
  input.addEventListener("mouseup", e => { if (justFocused) e.preventDefault(); justFocused = false; });
  // clicking the box again after a pick starts a new search
  input.addEventListener("click", () => { if (list.hidden) { input.select(); open(); } });
  input.addEventListener("input", () => { active = 0; open(); });
  input.addEventListener("blur", () => {
    // a typed address counts; a half-typed search goes back to the last choice
    const q = input.value.trim();
    if (!rows.length || looksLikeAddress(q)) set(q);
    else input.value = masterLabel(current());
    close();
  });
  input.addEventListener("keydown", e => {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      if (list.hidden) return open();
      const n = shown.length;
      if (!n) return;
      active = e.key === "ArrowDown" ? (active + 1) % n : (active - 1 + n) % n;
      paint();
    } else if (e.key === "Enter" && !list.hidden && shown[active]) {
      e.preventDefault();
      choose(shown[active].typed || String(shown[active].id));
    } else if (e.key === "Escape" && !list.hidden) {
      e.preventDefault();
      input.value = masterLabel(current());
      close();
    }
  });
  return h("div", { class: "combo" }, input, list);
}

function preselectMaster() {
  if (S.answers.master || !S.masters.length) return;
  const cc = (navigator.language.split("-")[1] || "").toUpperCase();
  const m = S.masters.find(m => m.country === cc);
  if (m) S.answers.master = String(m.id);
}

function mhz(s) { const n = parseFloat(String(s || "").replace(",", ".")); return isFinite(n) ? n : null; }
function refreshLive() {
  const el = $("#live"); if (!el) return;
  const rx = mhz(S.answers.rx_freq), duplex = S.answers.hat === "duplex";
  const tx = duplex ? mhz(S.answers.tx_freq) : rx;
  const f = n => n == null ? "—" : n.toFixed(4);
  el.replaceChildren(
    h("div", {}, h("small", {}, "YOUR RADIO TX"), f(rx)),
    h("div", {}, h("small", {}, "YOUR RADIO RX"), f(tx)),
    h("div", {}, h("small", {}, "SLOTS"), duplex ? "TS1 + TS2" : "TS2"));
}

const LINKS = {
  imager: "https://www.raspberrypi.com/software/",
  imagerWin: "https://downloads.raspberrypi.com/imager/imager_latest.exe",
  imagerMac: "https://downloads.raspberrypi.com/imager/imager_latest.dmg",
  imagerLinux: "https://downloads.raspberrypi.com/imager/imager_latest_amd64.AppImage",
  os: "https://downloads.raspberrypi.com/raspios_lite_arm64_latest",
  osAll: "https://www.raspberrypi.com/software/operating-systems/",
  osSha: "https://downloads.raspberrypi.com/raspios_lite_arm64_latest.sha256",
  etcher: "https://etcher.balena.io/",
  rufus: "https://rufus.ie/",
};
const ext = (href, text) => h("a", { href, target: "_blank", rel: "noopener" }, text);

function resumeEl() {
  if (!S.saved) return null;
  const n = S.sections.length, to = Math.max(1, Math.min(S.saved.step, n));
  const when = new Date(S.saved.saved * 1000).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
  return h("div", { class: "resume", role: "status" },
    h("div", {}, h("b", {}, "Welcome back"),
      h("p", {}, `Your answers from ${when} are filled in, up to the ${S.sections[to - 1].title} step. ` +
        "Passwords, the API key and the PIN aren't saved, so you'll type those again.")),
    h("div", { class: "resume-btns" },
      h("button", { class: "go", onclick: () => go(to) }, `Continue at ${S.sections[to - 1].title}`),
      h("button", { onclick: startOver }, "Start over")));
}

// A WPSD or Pi-Star configuration backup fills in what it can. The installer reads the zip;
// the passwords in it stay in this page, like typed ones.
async function importBackup(file) {
  S.importing = true; render();
  let r;
  try {
    const res = await fetch("/api/import", { method: "POST", body: file,
      headers: { "X-Token": TOKEN, "Content-Type": "application/zip" } });
    if (res.status === 403) throw new Error("This page's link is out of date. Use the address the installer printed in the terminal.");
    r = await res.json();
  } catch (e) { r = { error: e.message }; }
  S.importing = false;
  if (r.error) S.imported = { file: file.name, error: r.error };
  else {
    Object.assign(S.answers, r.answers);
    S.errors = {}; S.ids = null; S.reviewed = false;
    if (r.answers.master) S.masterTouched = true;
    S.imported = { file: file.name, keys: Object.keys(r.answers), notes: r.notes };
  }
  render();
}
function importEl() {
  const r = S.imported, ok = r && !r.error;
  const input = h("input", { type: "file", id: "f-backup", accept: ".zip,application/zip", hidden: true,
    onchange: e => { if (e.target.files[0]) importBackup(e.target.files[0]); } });
  const pick = h("button", { type: "button", class: S.importing ? "busy" : null, disabled: !!S.importing,
    onclick: () => input.click() }, S.importing ? "Reading…" : ok ? "Load another" : "Load backup");
  const box = h("section", { class: "import" + (ok ? " done" : ""), "aria-labelledby": "import-h" },
    h("div", { class: "import-head" },
      h("div", {}, h("h3", { class: "sub", id: "import-h" }, "Moving from WPSD or Pi-Star?"),
        h("p", {}, "Load its configuration backup and the answers it has are filled in for you. " +
          "Make one in its dashboard: Configuration → Backup/Restore → Download Configuration. Or drop the .zip here.")),
      input, pick));
  if (r && r.error) box.append(h("div", { class: "alarm", role: "alert" }, r.file + ": " + r.error));
  if (ok) {
    // what was filled in, by step; secrets by name only
    const rows = S.sections.map(s => [s.title, s.fields.filter(f => r.keys.includes(f.key)).map(f => f.label)])
      .filter(([, labels]) => labels.length);
    box.append(h("div", { role: "status" },
      h("dl", {}, h("dt", {}, "From"), h("dd", {}, h("code", {}, r.file)),
        rows.flatMap(([t, labels]) => [h("dt", {}, t), h("dd", {}, labels.join(", "))])),
      r.notes.length ? h("ul", {}, r.notes.map(n => h("li", {}, n))) : null,
      h("nav", { class: "btns" }, h("span"), h("button", { class: "go", onclick: () => go(1) }, "Check the answers"))));
  }
  box.addEventListener("dragover", e => { e.preventDefault(); box.classList.add("over"); });
  box.addEventListener("dragleave", () => box.classList.remove("over"));
  box.addEventListener("drop", e => {
    e.preventDefault(); box.classList.remove("over");
    const f = e.dataTransfer.files[0];
    if (f && !S.importing) importBackup(f);
  });
  return box;
}

    win: { href: LINKS.imagerWin, name: "Windows", note: "Installer for Windows 10 and 11" },
    mac: { href: LINKS.imagerMac, name: "macOS", note: "Disk image for macOS" },
    linux: armLinux ? { href: LINKS.imager, name: "Linux", note: "On ARM, install it with apt: rpi-imager" }

  const imagerBox = h("div", {},
    h("h3", { class: "sub" }, "Raspberry Pi Imager"),

// DMR IDs for the callsign, from radioid.net (through the installer, which has no CORS limits)
let idTimer = null;
function lookupIds() {
  clearTimeout(idTimer);
  const call = (S.answers.callsign || "").trim();
  if (!/^[A-Z0-9]{3,8}$/.test(call)) { if (S.ids) { S.ids = null; paintIds(); } return; }
  if (S.ids && S.ids.call === call) return;
  idTimer = setTimeout(async () => {
    const hits = await api("/api/ids?callsign=" + encodeURIComponent(call));
    if ((S.answers.callsign || "").trim() === call) { S.ids = { call, hits }; paintIds(); }
  }, 450);
}
function paintIds() {
  const el = $("#ids");
  if (el) { const box = idsEl(); box.classList.add("new"); el.replaceWith(box); }  // only fresh results fade in
}
function idsEl() {
  const box = h("div", { class: "ids", id: "ids", "aria-live": "polite" });
  if (!S.ids) return box;
  if (!S.ids.hits.length) {
    box.append(h("p", { class: "muted" }, `radioid.net has no DMR ID for ${S.ids.call}.`));
    return box;
  }
  box.append(h("p", { class: "ids-head" }, S.ids.hits.length > 1 ? `${S.ids.call} has ${S.ids.hits.length} IDs on radioid.net:` : `${S.ids.call} on radioid.net:`),
    h("div", { class: "id-list" }, S.ids.hits.map(r => {
      const where = [r.city, r.country].filter(Boolean).join(", ");
      const on = S.answers.dmr_id === String(r.id);
      return h("button", { type: "button", class: "id-chip" + (on ? " sel" : ""), "aria-pressed": String(on),
        onclick: () => {
          S.answers.dmr_id = String(r.id); delete S.errors.dmr_id;
          // the master this ID last used, unless one was picked by hand
          if (!S.masterTouched && (S.masters || []).some(m => String(m.id) === r.lastmaster)) S.answers.master = r.lastmaster;
          render();
        } },
        h("b", {}, r.id),
        h("span", {}, [r.name, where].filter(Boolean).join(" · ")),
        r.lastheard ? h("small", {}, "last heard " + new Date(r.lastheard).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" })) : null);
    })));
  return box;
}

function section(s) {
  const kids = [h("h2", {}, s.title)];
  if (s.id === "dashboard") kids.push(pitchEl());
  const pair = new Set(["dmr_id", "id_suffix", "rx_freq", "tx_freq", "rx_offset", "color_code", "wifi_password", "wifi_country", "pin", "port"]);
  let row = null;
  for (const f of s.fields) {
    if (!visible(f)) continue;
    const el = fieldEl(f);
    if (pair.has(f.key)) {
      if (!row) { row = h("div", { class: "row2" }); kids.push(row); }
      row.append(el);
      if (row.children.length === 2) row = null;
    } else { row = null; kids.push(el); }
    if (f.key === "hat") kids.push(h("div", { class: "lcd", id: "live" }));
    if (f.key === "id_suffix") { kids.push(idsEl()); if (!S.ids) lookupIds(); }
  }
  const n = nav("Back", "Next");
  // after an Edit from the review, go straight back to it
  if (S.reviewed && S.step < S.sections.length)
    n.lastChild.before(h("button", { class: "to-review", onclick: () => forward(true) }, "Back to review"));
  kids.push(n);
  return kids;
}

function writeStep() {
  const sum = S.summary || { groups: [], radio: {} }, r = sum.radio;
  const kids = [h("h2", {}, "Check and write"),
    h("p", { class: "lede" }, "Check your answers, then put the freshly flashed card in and write the setup to it.")];

  // what the radio needs, on the same LCD as the Radio step
  kids.push(h("div", { class: "lcd review" },
    h("div", {}, h("small", {}, "YOUR RADIO TX"), r.tx), h("div", {}, h("small", {}, "YOUR RADIO RX"), r.rx),
    h("div", {}, h("small", {}, "COLOUR CODE"), r.cc), h("div", {}, h("small", {}, "SLOTS"), r.slots)));

  kids.push(h("div", { class: "review-groups" }, sum.groups.map(g => {
    const step = 1 + S.sections.findIndex(s => s.id === g.section);
    return h("section", { class: "rgroup", "aria-label": g.title },
      h("header", {}, h("h3", { class: "sub" }, g.title),
        h("button", { type: "button", class: "link", onclick: () => go(step), "aria-label": `Edit ${g.title}` }, "Edit")),
      h("dl", {}, g.rows.flatMap(([k, v]) => [h("dt", {}, k), h("dd", {}, v)])));
  })));

  // the card: the list refreshes by itself while this step is open
  const ok = S.volumes.filter(v => v.ok);
  kids.push(h("h3", { class: "sub card-head" }, "SD card"));
  if (!S.volumes.length) kids.push(h("div", { class: "waiting", role: "status" },
    h("span", { class: "radar", "aria-hidden": "true" }),
    h("div", {}, h("b", {}, "Waiting for the card…"),
      h("div", { class: "muted" }, "Put the freshly flashed card in. It shows up here once your computer mounts its bootfs partition."))));
  for (const v of S.volumes) kids.push(h("label", { class: "vol" + (v.ok ? "" : " no") + (S.boot === v.path ? " sel" : "") },
    h("input", { type: "radio", name: "vol", checked: S.boot === v.path, disabled: !v.ok,
      onchange: () => { S.boot = v.path; S.typePath = false; render(); } }),
    h("div", {}, h("code", {}, v.path), h("div", { class: "st" }, v.status))));
  if (S.volumes.length && !ok.length) kids.push(h("p", { class: "muted vol-hint" },
    "None of these can be written. Flash the card again with Raspberry Pi OS Lite (64-bit), then put it back in."));
  kids.push(S.typePath
    ? h("div", { class: "field typed" },
        h("label", { class: "l", for: "f-boot" }, "Boot partition path"),
        h("input", { id: "f-boot", type: "text", class: "mono", placeholder: "/media/you/bootfs or E:\\", value: S.boot,
          oninput: e => { S.boot = e.target.value.trim(); $("nav.btns button.go").disabled = !S.boot; } }),
        h("div", { class: "help" }, "Checked when you write."))
    : h("p", { class: "muted vol-hint" }, "Card mounted somewhere unusual? ",
        h("button", { type: "button", class: "link", onclick: () => { S.typePath = true; render(); $("#f-boot").focus(); } }, "Type its path")));

  if (S.writeError) kids.push(h("div", { class: "alarm", role: "alert" }, S.writeError));
  kids.push(h("p", { class: "muted fine" }, "Only the card's boot partition changes. Your passwords stay on it until the first boot, which moves them off."));
  const n = nav("Back", S.writing ? "Writing…" : "Write to card", !S.boot || S.writing);
  if (S.writing) n.lastChild.classList.add("busy");
  kids.push(n);
  return kids;
}

function done() {
  const a = S.answers;
  return [
    h("h2", { class: "ok ready" }, checkMark(), "Card ready"),
    h("p", { class: "lede" }, "Eject the card, put it in the Pi with the hat on, and power it up."),
    h("ol", { class: "how" },
      h("li", {}, "The first boot takes ", h("b", {}, "5 to 15 minutes"), ": it resizes the card, joins the network and installs DMRHost."),
      h("li", {}, "When it's done the hotspot logs in to BrandMeister" + (a.oled !== "none" ? " and the OLED lights up." : ".")),
      a.dashboard ? h("li", {}, "Dashboard: ", h("b", {}, `http://${a.hostname}.local:${a.port}`)) : null,
      h("li", {}, "To watch the setup, or if something goes wrong:")),
    h("code", { class: "cmd" }, `ssh ${a.username}@${a.hostname}.local\ntail -f /var/log/dmrhost-firstboot.log`),
    h("p", { class: "muted" }, "Files written: " + S.written.join(", ")),
    h("nav", { class: "btns" }, h("button", { onclick: () => { S.boot = ""; S.writeError = ""; go(S.sections.length + 1); loadVolumes(); } }, "Write another card"),
      h("button", { class: "go", onclick: async () => { await api("/api/quit", {}); $("#main").replaceChildren(h("p", {}, "The installer has stopped. You can close this tab.")); } }, "Quit")),
  ];
}

function warnIcon() {
  // a warning triangle, drawn to match the check mark's stroke
  const ns = "http://www.w3.org/2000/svg", svg = document.createElementNS(ns, "svg");
  for (const [k, v] of [["width", 18], ["height", 18], ["viewBox", "0 0 24 24"], ["aria-hidden", "true"], ["fill", "none"],
    ["stroke", "currentColor"], ["stroke-width", "2"], ["stroke-linecap", "round"], ["stroke-linejoin", "round"]]) svg.setAttribute(k, v);
  for (const d of ["M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z", "M12 9v4", "M12 17h.01"]) {
    const p = document.createElementNS(ns, "path"); p.setAttribute("d", d); svg.append(p);
  }
  return svg;
}

function checkMark() {
  const ns = "http://www.w3.org/2000/svg", svg = document.createElementNS(ns, "svg"), p = document.createElementNS(ns, "path");
  for (const [k, v] of [["width", 22], ["height", 22], ["viewBox", "0 0 22 22"], ["aria-hidden", "true"]]) svg.setAttribute(k, v);
  for (const [k, v] of [["d", "M4 11.5l4.5 4.5L18 6.5"], ["fill", "none"], ["stroke", "currentColor"],
    ["stroke-width", "2.5"], ["stroke-linecap", "round"], ["stroke-linejoin", "round"]]) p.setAttribute(k, v);
  svg.append(p);
  return svg;
}

function nav(back, next, disabled) {
  return h("nav", { class: "btns" },
    back ? h("button", { onclick: () => go(S.step - 1) }, back) : h("span"),
    h("button", { class: "go", disabled: !!disabled, onclick: forward }, next));
}

async function forward(toReview) {
  const last = S.sections.length + 1;
  if (toReview && toReview.type) toReview = false;  // called as a click handler
  if (S.step >= 1 && S.step <= S.sections.length) {
    const fields = S.sections[S.step - 1].fields.map(f => f.key);
    const r = await api("/api/check", { answers: S.answers, fields });
    S.errors = r.errors;
    if (Object.keys(r.errors).length) {
      S.freshErrors = true;
      render();
      const bad = $(".field.bad input, .field.bad textarea, .field.bad select");
      if (bad) bad.focus();
      return;
    }
    if (S.step === S.sections.length || toReview) {
      const all = await api("/api/check", { answers: S.answers });
      if (Object.keys(all.errors).length) {
        S.errors = all.errors;
        S.freshErrors = true;
        const k = Object.keys(all.errors)[0];
        return go(1 + S.sections.findIndex(s => s.fields.some(f => f.key === k)));
      }
      S.summary = all.summary;
      S.reviewed = true;
      loadVolumes();
      return go(last);
    }
    return go(S.step + 1);
  }
  if (S.step === last) {
    S.writing = true; S.writeError = ""; render();
    const r = await api("/api/write", { answers: S.answers, boot: S.boot });
    S.writing = false;
    if (r.written) { S.written = r.written; return go(last + 1); }
    S.writeError = r.error || "Some answers need fixing: " + Object.keys(r.errors || {}).join(", ");
    return render();
  }
  go(S.step + 1);
}

async function loadVolumes() {
  const vols = await api("/api/volumes");
  const changed = JSON.stringify(vols) !== JSON.stringify(S.volumes);
  S.volumes = vols;
  const ok = vols.filter(v => v.ok);
  if (!S.typePath && !ok.some(v => v.path === S.boot)) S.boot = ok.length === 1 ? ok[0].path : "";
  if (changed && S.step === S.sections.length + 1) render();
}

// look for the card every 2 s while the Write step is open
let volTimer = null;
function watchVolumes(on) {
  if (on && !volTimer) volTimer = setInterval(() => { if (!S.writing) loadVolumes(); }, 2000);
  if (!on && volTimer) { clearInterval(volTimer); volTimer = null; }
}

function go(i) { S.step = i; render(); window.scrollTo(0, 0); }

// Answers are saved by the installer (not the browser: its port changes every run), so
// closing the tab doesn't lose them. It never saves passwords. Start is never saved, so
// opening the wizard doesn't overwrite where you got to.
let saveTimer = null;
function saveSoon() {
  if (S.step < 1) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => api("/api/progress", { answers: S.answers, step: Math.min(S.step, S.sections.length) })
    .catch(() => { /* saving is a convenience; the wizard works without it */ }), 500);
}
function startOver() {
  api("/api/progress", { clear: true }).catch(() => {});
  S.answers = { ...S.defaults }; S.saved = null; S.errors = {}; S.ids = null; S.reviewed = false; S.masterTouched = false;
  if (S.masters) preselectMaster();
  render();
}

function render() {
  renderSteps();
  const n = S.sections.length;
  const kids = S.step === 0 ? intro() : S.step <= n ? section(S.sections[S.step - 1]) : S.step === n + 1 ? writeStep() : done();
  const act = document.activeElement, focused = act && act.id;
  const caret = act && "selectionStart" in act ? act.selectionStart : null;
  // slide only when the step changes, not on re-renders within a step
  const dir = S.shown === undefined || S.shown === S.step ? "" : S.step > S.shown ? " fwd" : " back";
  S.shown = S.step;
  $("#main").replaceChildren(h("div", { class: "view" + dir }, kids));
  S.picked = null; S.freshErrors = false;
  saveSoon();
  watchVolumes(S.step === n + 1);
  refreshLive();
  const el = focused && document.getElementById(focused);
  if (el) {
    el.focus();
    if (caret != null) try { el.setSelectionRange(caret, caret); } catch (_) { /* not a text field */ }
  }
}

document.addEventListener("click", e => {
  for (const d of document.querySelectorAll("details.menu[open]")) if (!d.contains(e.target)) d.open = false;
});
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  for (const d of document.querySelectorAll("details.menu[open]")) { d.open = false; d.querySelector("summary").focus(); }
});

api("/api/form").then(f => {
  S.sections = f.sections; S.defaults = f.defaults; S.dmrdash = f.dmrdash;
  S.answers = { ...f.defaults, ...(f.saved ? f.saved.answers : {}) };
  if (f.saved && f.saved.step > 0) { S.saved = f.saved; S.masterTouched = !!f.saved.answers.master; }
  $("#ver").textContent = "v" + f.version;
  render();
}).catch(e => $("#main").replaceChildren(h("div", { class: "alarm" }, e.message)));
</script>
</body>
</html>
