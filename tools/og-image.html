<!doctype html>
<!-- Source for og-image.png. Regenerate from the site root with:
     chromium --headless=new --hide-scrollbars --window-size=1200,630 --virtual-time-budget=4000 \
       --screenshot=og-image.png http://localhost:8000/tools/og-image.html -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:wght@700;800&display=swap">
<link rel="stylesheet" href="../styles.css">
<style>
  body { width: 1200px; height: 630px; overflow: hidden; }
  .og { box-sizing: border-box; width: 1200px; height: 630px; padding: 64px 72px; display: flex; gap: 56px; align-items: center; border-top: 6px solid var(--lcd); }
  .og-copy { flex: 1 1 0; display: flex; flex-direction: column; gap: 26px; }
  .og-copy h1 { font-size: 66px; line-height: 1.0; }
  .og-copy p { font-size: 26px; color: var(--legend); line-height: 1.35; }
  .og-foot { display: flex; align-items: center; gap: 14px; font-size: 20px; font-weight: 600; color: var(--legend); }
  .og-vfo { flex: 0 0 440px; }
  .og-vfo .vfo-call { font-size: 76px; }
  .og-vfo .vfo-tg b { font-size: 38px; }
  .og-vfo .vfo-tg span { font-size: 19px; }
  .og-vfo .vfo-meta { font-size: 16px; }
</style>
</head>
<body>
<div class="og">
  <div class="og-copy">
    <span class="tag" style="font-size: 15px">DMRHOST INSTALLER</span>
    <h1>Your first DMR hotspot, without the Linux homework.</h1>
    <p>Raspberry Pi + MMDVM_HS, set up for BrandMeister before the first boot.</p>
    <div class="og-foot"><span class="led" aria-hidden="true"></span>Free and open source · Windows, macOS, Linux</div>
  </div>
  <div class="og-vfo module vfo">
    <div class="vfo-head">
      <span class="slot-tag">B</span>
      <span class="label">Timeslot 2</span>
      <span class="vfo-state"><span class="led led-tx" aria-hidden="true"></span>TX</span>
    </div>
    <div class="vfo-lcd">
      <div class="vfo-top">
        <span class="vfo-call">N0CALL</span>
        <span class="vfo-timer">0:12<span class="src">RF</span></span>
      </div>
      <div class="vfo-tg"><b>91</b><span>World-wide</span></div>
      <div class="vfo-meta">On BrandMeister in 5–15 minutes</div>
    </div>
  </div>
</div>
</body>
</html>
